<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Generic fallback only. js/app.js's navigate() rewrites document.title (and
       the .titlebar-title span below) to "NnzRP - <current view / character>"
       on every route change; Electron mirrors document.title to the taskbar. -->
  <title>NnzRP</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="shortcut icon" type="image/x-icon" href="src/icon.ico">
  <link rel="apple-touch-icon" href="src/icon.png">

  <!-- PWA (Android/web install target only - inert inside Electron, which
       never reads manifest.json and loads via file:// instead of http(s)://). -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131c2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NnzRP">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown parser library (Local offline copy) -->
  <script src="js/vendor/marked.min.js"></script>

  <!-- CSS Design System (Theming: light/dark tokens, toggle + dropdown components) -->
  <link rel="stylesheet" href="css/variables.css?v=1.2.0">
  <link rel="stylesheet" href="css/base.css?v=1.2.0">
  <link rel="stylesheet" href="css/components.css?v=1.5.4">
  <link rel="stylesheet" href="css/layout.css?v=1.2.5">
  <link rel="stylesheet" href="css/chat.css?v=1.3.0">

  <!--
    Pre-paint theme bootstrap.

    The theme preference lives in IndexedDB (see js/storage/themeStore.js), which
    is asynchronous and therefore cannot be consulted before the first paint - a
    dark-mode user would get a white flash on every launch. Each write is
    mirrored into localStorage, and this synchronous head script replays that
    mirror onto <html> before anything renders. js/ui/theme.js re-applies from
    the IndexedDB source of truth once the app boots.

    Keep the storage keys and the derived custom properties in sync with
    js/storage/themeStore.js and js/ui/theme.js.
  -->
  <script>
    (function () {
      // Stamped before first paint (not in app.js, which runs much later) so
      // the desktop-only titlebar never flashes on screen before disappearing
      // when the app is opened in a plain browser tab (see run_localhost.bat) -
      // window.electronAPI is injected by preload.js ahead of any page script,
      // so it's already reliable this early. Electron's own window always
      // keeps the titlebar regardless of window width - this is a JS/runtime
      // check, not a viewport-width media query, because a narrow Electron
      // window still needs its minimize/maximize/close controls.
      if (!window.electronAPI) {
        document.documentElement.classList.add('browser-mode');
      }
      try {
        var mode = localStorage.getItem('nnzrp_theme_mode');
        // 'auto' (or anything unrecognised) leaves data-theme unset, handing the
        // decision to the prefers-color-scheme media query in variables.css.
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.setAttribute('data-theme', mode);
        }
        document.documentElement.setAttribute('data-theme-mode', (mode === 'light' || mode === 'dark') ? mode : 'auto');

        var accent = JSON.parse(localStorage.getItem('nnzrp_theme_accent') || '{}');
        var hex = /^#[0-9a-fA-F]{6}$/;
        var isDefaultAccent = hex.test(accent.primary) && accent.primary.toLowerCase() === '#4f46e5'
          && (!accent.secondary || (hex.test(accent.secondary) && accent.secondary.toLowerCase() === '#7c3aed'));
        if (hex.test(accent.primary) && !isDefaultAccent) {
          var s = document.documentElement.style;
          s.setProperty('--accent-primary', accent.primary);
          s.setProperty('--accent-primary-hover', 'color-mix(in srgb, ' + accent.primary + ' 78%, var(--text-main))');
          s.setProperty('--text-accent', 'color-mix(in srgb, ' + accent.primary + ' 72%, var(--text-main))');
          s.setProperty('--border-focus', accent.primary);
          s.setProperty('--gradient-primary', accent.primary);
          s.setProperty('--accent-primary-soft', 'color-mix(in srgb, ' + accent.primary + ' 18%, var(--bg-surface))');
          s.setProperty('--accent-primary-softer', 'color-mix(in srgb, ' + accent.primary + ' 10%, var(--bg-surface))');
          s.setProperty('--shadow-glow', '0 0 0 2px color-mix(in srgb, ' + accent.primary + ' 30%, transparent)');
          if (hex.test(accent.secondary)) {
            s.setProperty('--accent-secondary', accent.secondary);
            s.setProperty('--gradient-accent', accent.secondary);
            s.setProperty('--accent-secondary-soft', 'color-mix(in srgb, ' + accent.secondary + ' 12%, var(--bg-surface))');
            s.setProperty('--accent-secondary-border', 'color-mix(in srgb, ' + accent.secondary + ' 40%, var(--bg-surface))');
          }
        }
      } catch (e) { /* no storage access - fall through to the CSS defaults */ }
    })();
  </script>

  <!-- Critical inline loading styles (theme-token driven so the splash never
       flashes light-on-dark before the main stylesheets are parsed). -->
  <style>
    body { margin: 0; padding: 0; background-color: var(--bg-primary, #f1f5f9); font-family: 'Inter', system-ui, sans-serif; }
    .app-loading-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh; width: 100%;
      background: var(--bg-primary, #f1f5f9);
      animation: appLoadingFadeIn 0.3s ease-out;
    }
    .app-loading-card {
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg-surface, #ffffff); padding: 2.75rem 3rem;
      border-radius: 18px; border: 1px solid var(--border-light, #e2e8f0);
      box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.28);
      text-align: center; max-width: 380px; width: 90%;
      animation: appLoadingRiseIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .app-loading-logo {
      width: 68px; height: 68px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, var(--brand-gradient-from, #f59e0b) 0%, var(--brand-gradient-to, #d97706) 100%);
      box-shadow: 0 10px 28px -10px color-mix(in srgb, var(--brand-gradient-to, #d97706) 55%, transparent);
      animation: appLoadingPulse 2.2s ease-in-out infinite;
    }
    .app-loading-logo-inner {
      width: 58px; height: 58px; border-radius: 14px;
      background: var(--bg-surface, #ffffff);
      display: flex; align-items: center; justify-content: center;
    }
    .app-loading-title { font-family: 'Outfit', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text-main, #0f172a); margin: 0 0 1.25rem 0; }
    .app-loading-spinner {
      width: 36px; height: 36px; border-radius: 50%; margin-bottom: 1rem;
      border: 3px solid var(--border-light, #e2e8f0);
      border-top-color: var(--accent-primary, #4f46e5);
      border-right-color: var(--accent-primary, #4f46e5);
      animation: appSpinnerRotate 0.75s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .app-loading-sub { font-size: 0.85rem; color: var(--text-dim, #64748b); margin: 0; font-weight: 500; }
    .app-loading-dot { display: inline-block; opacity: 0.2; animation: appLoadingDotFade 1.4s ease-in-out infinite; }
    .app-loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .app-loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes appSpinnerRotate { to { transform: rotate(360deg); } }
    @keyframes appLoadingPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes appLoadingFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes appLoadingRiseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes appLoadingDotFade { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }

    /* browser-mode (PWA / plain browser tab / the installed Android APK, an
       otherwise-identical Capacitor WebView shell around this same page -
       see capacitor.config.json) splash, styled to match main.js's Electron
       splash window (createSplashWindow) exactly - same dark hero-panel
       layout, same spinner/progress-sweep language - so the web/Android
       build reads as the same polished app instead of a plain loading
       spinner. Electron never shows this: its own native splash window
       already covers this whole moment, well before this page's own JS runs
       at all, so `.app-loading-screen-electron` (the pre-existing light
       card above) stays as its effectively-invisible fallback and is
       untouched.
       Also the one place a real update check happens (js/app.js's
       checkForAppUpdate(), Android-only): it flips `#native-splash-status`
       to "Checking for updates" via textContent before falling back to the
       loading text, and reveals `#native-splash-update` if version.json's
       `latestApkVersion` doesn't match the running APK's own version. */
    .app-loading-screen-native { display: none; }
    html.browser-mode .app-loading-screen-electron { display: none; }
    html.browser-mode .app-loading-screen-native {
      display: flex;
      position: fixed; inset: 0; z-index: 20000;
      background: #0b0b0c; color: #f5f5f5;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      animation: appLoadingFadeIn 0.3s ease-out;
    }
    .native-splash-hero {
      position: relative; flex: none;
      width: 34%; min-width: 120px; max-width: 240px;
      overflow: hidden;
    }
    .native-splash-hero::before {
      content: ''; position: absolute; inset: -40px;
      background-image: url('src/icon.png');
      background-size: cover; background-position: center;
      filter: blur(30px) brightness(0.3) saturate(0.65) contrast(1.12);
    }
    .native-splash-hero::after {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(to bottom, rgba(11,11,12,0.55) 0%, rgba(11,11,12,0) 34%, rgba(11,11,12,0) 62%, rgba(11,11,12,0.6) 100%),
        linear-gradient(100deg, rgba(11,11,12,0.32) 0%, rgba(11,11,12,0.06) 42%, rgba(11,11,12,0.9) 84%, #0b0b0c 100%);
    }
    .native-splash-hero-logo {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 25vw; max-width: 92px; min-width: 56px; height: auto; border-radius: 5px;
      box-shadow: 0 20px 44px -18px rgba(0,0,0,0.95);
    }
    .native-splash-panel {
      position: relative; flex: 1 1 auto; min-width: 0;
      padding: 36px 28px 30px 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .native-splash-title {
      margin: 0 0 32px 0; font-family: 'Outfit', sans-serif;
      font-size: clamp(22px, 6vw, 30px); font-weight: 800;
      line-height: 1.05; letter-spacing: -0.025em; color: #ffffff;
    }
    .native-splash-loading { display: flex; align-items: center; gap: 16px; }
    .native-splash-spinner {
      flex: none; width: 28px; height: 28px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.14); border-top-color: #f0f0f0;
      animation: spin 0.85s linear infinite;
    }
    .native-splash-loading-title { font-size: 14px; font-weight: 700; color: #f2f2f2; letter-spacing: -0.005em; }
    .native-splash-loading-sub { font-size: 11.5px; color: #8a8a8e; margin-top: 4px; }
    .native-splash-dot { display: inline-block; opacity: 0.2; animation: appLoadingDotFade 1.4s ease-in-out infinite; }
    .native-splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .native-splash-dot:nth-child(3) { animation-delay: 0.4s; }
    .native-splash-update {
      margin-top: 22px; padding: 12px 14px;
      background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
    }
    .native-splash-update.hidden { display: none; }
    .native-splash-update p { margin: 0 0 8px 0; font-size: 12.5px; color: #f5deb3; }
    .native-splash-update a {
      display: inline-block; font-size: 12.5px; font-weight: 700;
      color: #0b0b0c; background: #f0b429; padding: 6px 12px; border-radius: 6px;
      text-decoration: none;
    }
    .native-splash-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.07); overflow: hidden; }
    .native-splash-progress span {
      position: absolute; top: 0; bottom: 0; width: 34%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%);
      animation: sweep 1.5s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sweep { 0% { left: -34%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <!-- Custom Desktop Window Header & Controls -->
  <header id="custom-titlebar" class="custom-titlebar">
    <div class="titlebar-left">
      <img src="src/icon.png" class="titlebar-icon" alt="NnzRP Icon">
      <span class="titlebar-title" id="titlebar-title">NnzRP</span>
    </div>
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-controls" id="titlebar-controls">
      <button class="titlebar-btn" id="btn-win-minimize" aria-label="Minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect y="5" width="12" height="1.5" rx="0.75"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-win-maximize" aria-label="Maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="1"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-win-close" aria-label="Close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <!-- App Mounting Shell -->
  <div id="app">
    <!-- Electron only in practice - see the CSS comment above this block's
         sibling below for why. -->
    <div class="app-loading-screen app-loading-screen-electron">
      <div class="app-loading-card">
        <div class="app-loading-logo">
          <div class="app-loading-logo-inner">
            <img src="src/icon.png" style="width:40px; height:40px;" alt="NnzRP Icon">
          </div>
        </div>
        <h2 class="app-loading-title" style="background: linear-gradient(135deg, var(--brand-gradient-from, #f59e0b) 0%, var(--brand-gradient-to, #d97706) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">NnzRP</h2>
        <div class="app-loading-spinner"></div>
        <p class="app-loading-sub">Loading Session &amp; Database<span class="app-loading-dot">.</span><span class="app-loading-dot">.</span><span class="app-loading-dot">.</span></p>
      </div>
    </div>

    <!-- browser-mode (PWA / plain browser / installed Android APK) - same
         dark hero-panel splash as Electron's own native splash window, see
         the CSS block above. js/app.js's checkForAppUpdate() (Android-only)
         drives #native-splash-status/#native-splash-update while this is on
         screen; renderShell() below wipes this whole div the instant real
         content is ready, exactly like the Electron card above. -->
    <div class="app-loading-screen-native">
      <div class="native-splash-hero">
        <img src="src/icon.png" class="native-splash-hero-logo" alt="NnzRP">
      </div>
      <div class="native-splash-panel">
        <h1 class="native-splash-title">NnzRP<br>Roleplay Studio</h1>
        <div class="native-splash-loading">
          <div class="native-splash-spinner"></div>
          <div>
            <div class="native-splash-loading-title" id="native-splash-status">Loading<span class="native-splash-dot">.</span><span class="native-splash-dot">.</span><span class="native-splash-dot">.</span></div>
            <div class="native-splash-loading-sub" id="native-splash-sub">Preparing modules &amp; local database</div>
          </div>
        </div>
        <div class="native-splash-update hidden" id="native-splash-update">
          <p>A newer app version is available.</p>
          <a id="native-splash-update-link" href="#" target="_blank" rel="noopener">Download update</a>
        </div>
      </div>
      <div class="native-splash-progress"><span></span></div>
    </div>
  </div>

  <!-- Main JavaScript ES Module -->
  <script type="module" src="js/app.js?v=1.2.0"></script>

  <!-- Service worker: web/Android install target only. Electron always loads
       via file:// and never needs this, so it's skipped entirely there. -->
  <script>
    // Private-LAN hostname (npm run serve + a phone on the same Wi-Fi, for
    // live-testing edits) never registers the service worker, and actively
    // tears down any registration/cache a PREVIOUS visit left behind. Without
    // this, sw.js's stale-while-revalidate (see sw.js) means every edit needs
    // two reloads to show up (1st reload serves the stale cached copy while
    // refetching in the background, 2nd reload finally serves what got
    // refetched) - and once a phone has visited once, restarting the node
    // server changes nothing, since serve.js reads straight off disk on every
    // request and the staleness is entirely client-side cache, not anything
    // the server controls. The real deployed site (GitHub Pages) and the
    // Android APK's live server.url are never a private LAN hostname, so this
    // never touches production PWA/offline behavior.
    const isDevLanHost = /^(localhost|127\.0\.0\.1|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(location.hostname);
    if (!window.electronAPI && 'serviceWorker' in navigator) {
      if (isDevLanHost) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister());
        });
        if (window.caches) {
          caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    }
  </script>
</body>
</html>
