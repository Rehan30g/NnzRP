<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Generic fallback only. js/app.js's navigate() rewrites document.title (and
       the .titlebar-title span below) to "NnzRP - <current view / character>"
       on every route change; Electron mirrors document.title to the taskbar. -->
  <title>NnzRP</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="shortcut icon" type="image/x-icon" href="src/icon.ico">
  <link rel="apple-touch-icon" href="src/icon.png">

  <!-- PWA (Android/web install target only - inert inside Electron, which
       never reads manifest.json and loads via file:// instead of http(s)://). -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131c2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NnzRP">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown parser library (Local offline copy) -->
  <script src="js/vendor/marked.min.js"></script>

  <!-- CSS Design System (Theming: light/dark tokens, toggle + dropdown components) -->
  <link rel="stylesheet" href="css/variables.css?v=1.2.0">
  <link rel="stylesheet" href="css/base.css?v=1.2.0">
  <link rel="stylesheet" href="css/components.css?v=1.2.5">
  <link rel="stylesheet" href="css/layout.css?v=1.2.1">
  <link rel="stylesheet" href="css/chat.css?v=1.2.0">

  <!--
    Pre-paint theme bootstrap.

    The theme preference lives in IndexedDB (see js/storage/themeStore.js), which
    is asynchronous and therefore cannot be consulted before the first paint - a
    dark-mode user would get a white flash on every launch. Each write is
    mirrored into localStorage, and this synchronous head script replays that
    mirror onto <html> before anything renders. js/ui/theme.js re-applies from
    the IndexedDB source of truth once the app boots.

    Keep the storage keys and the derived custom properties in sync with
    js/storage/themeStore.js and js/ui/theme.js.
  -->
  <script>
    (function () {
      // Stamped before first paint (not in app.js, which runs much later) so
      // the desktop-only titlebar never flashes on screen before disappearing
      // when the app is opened in a plain browser tab (see run_localhost.bat) -
      // window.electronAPI is injected by preload.js ahead of any page script,
      // so it's already reliable this early. Electron's own window always
      // keeps the titlebar regardless of window width - this is a JS/runtime
      // check, not a viewport-width media query, because a narrow Electron
      // window still needs its minimize/maximize/close controls.
      if (!window.electronAPI) {
        document.documentElement.classList.add('browser-mode');
      }
      try {
        var mode = localStorage.getItem('nnzrp_theme_mode');
        // 'auto' (or anything unrecognised) leaves data-theme unset, handing the
        // decision to the prefers-color-scheme media query in variables.css.
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.setAttribute('data-theme', mode);
        }
        document.documentElement.setAttribute('data-theme-mode', (mode === 'light' || mode === 'dark') ? mode : 'auto');

        var accent = JSON.parse(localStorage.getItem('nnzrp_theme_accent') || '{}');
        var hex = /^#[0-9a-fA-F]{6}$/;
        var isDefaultAccent = hex.test(accent.primary) && accent.primary.toLowerCase() === '#4f46e5'
          && (!accent.secondary || (hex.test(accent.secondary) && accent.secondary.toLowerCase() === '#7c3aed'));
        if (hex.test(accent.primary) && !isDefaultAccent) {
          var s = document.documentElement.style;
          s.setProperty('--accent-primary', accent.primary);
          s.setProperty('--accent-primary-hover', 'color-mix(in srgb, ' + accent.primary + ' 78%, var(--text-main))');
          s.setProperty('--text-accent', 'color-mix(in srgb, ' + accent.primary + ' 72%, var(--text-main))');
          s.setProperty('--border-focus', accent.primary);
          s.setProperty('--gradient-primary', accent.primary);
          s.setProperty('--accent-primary-soft', 'color-mix(in srgb, ' + accent.primary + ' 18%, var(--bg-surface))');
          s.setProperty('--accent-primary-softer', 'color-mix(in srgb, ' + accent.primary + ' 10%, var(--bg-surface))');
          s.setProperty('--shadow-glow', '0 0 0 2px color-mix(in srgb, ' + accent.primary + ' 30%, transparent)');
          if (hex.test(accent.secondary)) {
            s.setProperty('--accent-secondary', accent.secondary);
            s.setProperty('--gradient-accent', accent.secondary);
            s.setProperty('--accent-secondary-soft', 'color-mix(in srgb, ' + accent.secondary + ' 12%, var(--bg-surface))');
            s.setProperty('--accent-secondary-border', 'color-mix(in srgb, ' + accent.secondary + ' 40%, var(--bg-surface))');
          }
        }
      } catch (e) { /* no storage access - fall through to the CSS defaults */ }
    })();
  </script>

  <!-- Critical inline loading styles (theme-token driven so the splash never
       flashes light-on-dark before the main stylesheets are parsed). -->
  <style>
    body { margin: 0; padding: 0; background-color: var(--bg-primary, #f1f5f9); font-family: 'Inter', system-ui, sans-serif; }
    .app-loading-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh; width: 100%;
      background: var(--bg-primary, #f1f5f9);
      animation: appLoadingFadeIn 0.3s ease-out;
    }
    .app-loading-card {
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg-surface, #ffffff); padding: 2.75rem 3rem;
      border-radius: 18px; border: 1px solid var(--border-light, #e2e8f0);
      box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.28);
      text-align: center; max-width: 380px; width: 90%;
      animation: appLoadingRiseIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .app-loading-logo {
      width: 68px; height: 68px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, var(--brand-gradient-from, #f59e0b) 0%, var(--brand-gradient-to, #d97706) 100%);
      box-shadow: 0 10px 28px -10px color-mix(in srgb, var(--brand-gradient-to, #d97706) 55%, transparent);
      animation: appLoadingPulse 2.2s ease-in-out infinite;
    }
    .app-loading-logo-inner {
      width: 58px; height: 58px; border-radius: 14px;
      background: var(--bg-surface, #ffffff);
      display: flex; align-items: center; justify-content: center;
    }
    .app-loading-title { font-family: 'Outfit', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text-main, #0f172a); margin: 0 0 1.25rem 0; }
    .app-loading-spinner {
      width: 36px; height: 36px; border-radius: 50%; margin-bottom: 1rem;
      border: 3px solid var(--border-light, #e2e8f0);
      border-top-color: var(--accent-primary, #4f46e5);
      border-right-color: var(--accent-primary, #4f46e5);
      animation: appSpinnerRotate 0.75s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .app-loading-sub { font-size: 0.85rem; color: var(--text-dim, #64748b); margin: 0; font-weight: 500; }
    .app-loading-dot { display: inline-block; opacity: 0.2; animation: appLoadingDotFade 1.4s ease-in-out infinite; }
    .app-loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .app-loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes appSpinnerRotate { to { transform: rotate(360deg); } }
    @keyframes appLoadingPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes appLoadingFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes appLoadingRiseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes appLoadingDotFade { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
  </style>
</head>
<body>
  <!-- Custom Desktop Window Header & Controls -->
  <header id="custom-titlebar" class="custom-titlebar">
    <div class="titlebar-left">
      <img src="src/icon.png" class="titlebar-icon" alt="NnzRP Icon">
      <span class="titlebar-title" id="titlebar-title">NnzRP</span>
    </div>
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-controls" id="titlebar-controls">
      <button class="titlebar-btn" id="btn-win-minimize" aria-label="Minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect y="5" width="12" height="1.5" rx="0.75"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-win-maximize" aria-label="Maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="1"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-win-close" aria-label="Close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <!-- App Mounting Shell -->
  <div id="app">
    <div class="app-loading-screen">
      <div class="app-loading-card">
        <div class="app-loading-logo">
          <div class="app-loading-logo-inner">
            <img src="src/icon.png" style="width:40px; height:40px;" alt="NnzRP Icon">
          </div>
        </div>
        <h2 class="app-loading-title" style="background: linear-gradient(135deg, var(--brand-gradient-from, #f59e0b) 0%, var(--brand-gradient-to, #d97706) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">NnzRP</h2>
        <div class="app-loading-spinner"></div>
        <p class="app-loading-sub">Loading Session &amp; Database<span class="app-loading-dot">.</span><span class="app-loading-dot">.</span><span class="app-loading-dot">.</span></p>
      </div>
    </div>
  </div>

  <!-- Main JavaScript ES Module -->
  <script type="module" src="js/app.js?v=1.2.0"></script>

  <!-- Service worker: web/Android install target only. Electron always loads
       via file:// and never needs this, so it's skipped entirely there. -->
  <script>
    if (!window.electronAPI && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
