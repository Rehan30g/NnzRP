<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NnzRP - BYOK AI Roleplay Client</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="shortcut icon" type="image/x-icon" href="src/icon.ico">
  <link rel="apple-touch-icon" href="src/icon.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown parser library (Local offline copy) -->
  <script src="js/vendor/marked.min.js"></script>

  <!-- CSS Design System (Direct AI Message Swiping & Clean Floating Input) -->
  <link rel="stylesheet" href="css/variables.css?v=1.1.4">
  <link rel="stylesheet" href="css/base.css?v=1.1.4">
  <link rel="stylesheet" href="css/components.css?v=1.1.5">
  <link rel="stylesheet" href="css/layout.css?v=1.1.4">
  <link rel="stylesheet" href="css/chat.css?v=1.1.6">

  <!-- Critical Inline Loading Styles to prevent initial flash -->
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; }
    .app-loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; width: 100%; background: #f1f5f9; }
    .app-loading-card { display: flex; flex-direction: column; align-items: center; background: #ffffff; padding: 2.5rem 3rem; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(15,23,42,0.05); text-align: center; max-width: 380px; width: 90%; }
    .app-loading-logo { width: 56px; height: 56px; background: transparent; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; }
    .app-loading-title { font-family: 'Outfit', sans-serif; font-size: 1.35rem; font-weight: 700; color: #0f172a; margin: 0 0 1.25rem 0; }
    .app-loading-spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: appSpinnerRotate 0.8s linear infinite; margin-bottom: 1rem; }
    .app-loading-sub { font-size: 0.85rem; color: #64748b; margin: 0; font-weight: 500; }
    @keyframes appSpinnerRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Custom Desktop Window Header & Controls -->
  <header id="custom-titlebar" class="custom-titlebar">
    <div class="titlebar-left">
      <img src="src/icon.png" class="titlebar-icon" alt="NnzRP Icon">
      <span class="titlebar-title">NnzRP - BYOK AI Roleplay Client</span>
    </div>
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-controls" id="titlebar-controls">
      <button class="titlebar-btn" id="btn-win-minimize" aria-label="Minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect y="5" width="12" height="1.5" rx="0.75"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-win-maximize" aria-label="Maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="1"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-win-close" aria-label="Close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
      </button>
    </div>
  </header>

  <!-- App Mounting Shell -->
  <div id="app">
    <div class="app-loading-screen">
      <div class="app-loading-card">
        <div class="app-loading-logo" style="width:64px; height:64px;">
          <img src="src/icon.png" class="pixel-art" style="width:64px; height:64px;" alt="NnzRP Icon">
        </div>
        <h2 class="app-loading-title" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">NnzRP</h2>
        <div class="app-loading-spinner"></div>
        <p class="app-loading-sub">Loading Session &amp; Database...</p>
      </div>
    </div>
  </div>

  <!-- Main JavaScript ES Module -->
  <script type="module" src="js/app.js?v=1.1.4"></script>
</body>
</html>
