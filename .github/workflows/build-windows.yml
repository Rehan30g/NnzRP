name: Build Windows installer

# Manual trigger ONLY. Unlike the Android APK (which loads its content live
# from GitHub Pages, see build-apk.yml), the Electron desktop build is a
# fully bundled local app (main.js loadFile()s index.html directly) - so a
# new installer genuinely IS required whenever the app changes, there's no
# "content updates without rebuilding" story here. Still manual-only rather
# than on-push, since routine web-app iteration shouldn't force a multi-
# minute Windows build on every commit; run this deliberately when a new
# desktop release is actually wanted.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Matches the existing local `npm run build:exe` script exactly -
      # produces an NSIS installer, a portable .exe, and a .zip in dist/.
      - run: npm run build:exe

      # Fail fast rather than let a silently-empty dist/ reach the release step.
      - name: Verify installer was produced
        shell: bash
        run: |
          INSTALLER_PATH=$(find dist -maxdepth 1 -iname "*Setup*.exe" | head -n1)
          if [ -z "$INSTALLER_PATH" ]; then echo "No installer .exe produced" >&2; exit 1; fi

      # Same shared `latest` release tag as build-apk.yml (see its own
      # comment) - this just adds/updates the Windows asset on that release
      # without touching the Android one.
      #
      # dist/latest.yml + the installer's .blockmap are included alongside
      # the .exe files so main.js's electron-updater (autoUpdater) can find
      # and verify a newer release - both are written locally by
      # electron-builder regardless of --publish=never above (confirmed:
      # they're produced even with no GH_TOKEN/publish flag in play at all),
      # so this just uploads what's already sitting in dist/ rather than
      # switching to electron-builder's own --publish flow, which would
      # create a separate version-tagged release instead of using this
      # shared one. See main.js's setupAutoUpdater() for the full mechanism.
      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NnzRP (Latest Build)
          body: |
            Latest builds of NnzRP for each platform.

            - **Android**: sideload the `.apk` (Chrome will warn about installing
              from an unknown source - expected for a non-Play-Store app). Its
              content always loads live from GitHub Pages, so it never needs
              reinstalling for ordinary app updates - only for native-shell
              changes (icon, permissions, appId, Capacitor/Android SDK version).
            - **Windows**: run the `Setup .exe` installer (NSIS) once. After that,
              the installed app checks this same release for updates on launch
              and installs newer ones automatically (prompts to restart) - no
              manual reinstall needed unless a `latest.yml`-covered auto-update
              itself fails, in which case re-running the Setup installer always
              works as a fallback.

              **Windows may block the installer** ("Smart App Control blocked an
              app that may be unsafe", or a SmartScreen warning) - the `.exe`
              isn't code-signed yet, so Windows can't verify the publisher. If
              that happens and you still want to install it:
              1. Settings → Privacy & security → Windows Security → App & browser
                 control → Smart App Control settings → turn it **Off**.
              2. Run the installer again.
              3. You can turn Smart App Control back on afterward if you like -
                 just know that once it's off, Windows only lets you re-enable it
                 via a clean reinstall of Windows, not a simple toggle back on.
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
