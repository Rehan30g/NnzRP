name: Build signed Android APK

# Manual trigger ONLY, deliberately never runs on push. Routine frontend/CSS/
# JS changes are handled entirely by deploy-pages.yml and reach the already-
# installed APK on its next launch with no rebuild - this workflow only needs
# to run again when the native shell itself changes (app icon, permissions,
# appId, Capacitor/Android SDK version).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Copies www/ + capacitor.config.json into the native project so the
      # build always reflects the current server.url / appId / etc.
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # Keystore is never committed (see .gitignore) - decoded here from the
      # ANDROID_KEYSTORE_BASE64 repo secret into a gitignored (*.keystore)
      # path for this job only, then referenced by android/app/build.gradle's
      # env-var-driven signingConfig.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # tr strips any stray whitespace/newlines the secret's value may carry
        # (base64 -d is lenient about embedded newlines, but not other stray
        # whitespace) before decoding to the keystore file.
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${{ github.workspace }}/release.keystore"
          ls -la "${{ github.workspace }}/release.keystore"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then echo "No APK produced" >&2; exit 1; fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # One fixed, stable tag/release - shared with build-windows.yml - so
      # there's always a single bookmarkable release page with a download for
      # each platform. Re-running either workflow only replaces that
      # workflow's own asset (softprops/action-gh-release adds/updates files,
      # it doesn't clear the release), so the Android and Windows builds don't
      # need to happen in the same run or even the same day to both show up here.
      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NnzRP (Latest Build)
          body: |
            Latest builds of NnzRP for each platform.

            - **Android**: sideload the `.apk` (Chrome will warn about installing
              from an unknown source - expected for a non-Play-Store app). Its
              content always loads live from GitHub Pages, so it never needs
              reinstalling for ordinary app updates - only for native-shell
              changes (icon, permissions, appId, Capacitor/Android SDK version).
            - **Windows**: run the `Setup .exe` installer (NSIS). This is a
              fully bundled desktop build, so a new install IS needed whenever
              the app itself changes - it does not load anything live.
          files: ${{ steps.apk.outputs.path }}
